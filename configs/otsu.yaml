# Classical baseline 1: Otsu thresholding.
# No training required - this is a deterministic preprocessing pipeline.

experiment:
  name: otsu_baseline
  seed: 42

data:
  root: data/cell_specimens_data
  test_split_only: true           # baselines are evaluated on the same test split
  test_split: 0.15
  num_classes: 3                  # background / cytoplasm / nucleus

method:
  type: otsu
  channel: grayscale              # convert RGB to grayscale before thresholding
  num_thresholds: 2               # multi-level Otsu -> 3 classes
  smoothing:
    median_filter_size: 3         # gentle pre-smoothing to suppress speckle

post_process:
  min_component_area: 50
  morphological_closing_radius: 3

paths:
  output_dir: results/runs/otsu_baseline
  metrics_out: results/metrics/otsu_test.json
