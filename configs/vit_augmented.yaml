# Augmentation-ablation ViT run.
# Identical to configs/vit.yaml EXCEPT photometric augmentation is enabled.
# This is the run that produced the negative result reported in Section 5.6.

experiment:
  name: vit_seg_augmented
  seed: 42
  deterministic: true

data:
  root: data/cell_specimens_data
  train_split: 0.70
  val_split:   0.15
  test_split:  0.15
  num_classes: 3
  input_size: 224
  align_crop_to: 16
  normalise:
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]
  augmentation:
    geometric:
      hflip_p: 0.5
      vflip_p: 0.5
      rot_deg: 15
    photometric:
      enabled: true
      brightness: 0.2             # plus/minus 20 %
      contrast: 0.2               # plus/minus 20 %
      saturation: 0.2
      hue: 0.05
      colour_jitter_p: 0.5
      gaussian_noise_std: 0.01
      per_channel_intensity_jitter: 0.10   # plus/minus 10 % per RGB channel

model:
  encoder: vit_base_patch16_224
  pretrained: imagenet21k
  decoder: unet
  decoder_channels: [256, 128, 64, 32]
  skip_connections_from: [3, 6, 9, 12]
  num_classes: 3

loss:
  type: cross_entropy
  weighting: inverse_frequency
  class_weights: [0.84, 0.69, 1.47]

optim:
  optimizer: adamw
  betas: [0.9, 0.999]
  weight_decay: 1.0e-4
  encoder_lr: 1.0e-5
  decoder_lr: 1.0e-4
  scheduler: cosine
  scheduler_T_max: 80
  grad_clip: 1.0

train:
  epochs: 80
  batch_size: 16
  val_batch_size: 8
  amp: true
  num_workers: 4
  early_stopping: false
  checkpoint_top_k: 3

inference:
  post_process:
    min_component_area: 50
    morphological_closing_radius: 3

paths:
  output_dir: results/runs/vit_seg_augmented
  weights_out: results/weights/vit_seg_augmented_best.pth
  metrics_out: results/metrics/vit_augmented_test.json
